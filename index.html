<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReviewsTap — Оценка качества обслуживания</title>
  <style>
    :root {
      --primary: #10b981;
      --star-active: #fbbf24;
      --star-inactive: #e2e8f0;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #f8fafc 0%, #e2e8f0 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 28px 24px 34px;
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.03);
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
    }

    /* Шапка карточки: бейдж заведения + переключатель языка */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .venue-badge {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text-main);
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 999px;
    }

    /* Выпадающий список языков */
    .lang-dropdown {
      position: relative;
      user-select: none;
      z-index: 20;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      background: #f1f5f9;
    }

    .lang-arrow {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      transition: transform 0.25s ease;
    }

    .lang-dropdown.open .lang-arrow {
      transform: rotate(180deg);
    }

    .lang-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: none;
      flex-direction: column;
      min-width: 78px;
    }

    .lang-dropdown.open .lang-menu {
      display: flex;
      animation: fadeIn 0.18s ease;
    }

    .lang-option {
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .lang-option:hover {
      background: #f8fafc;
      color: var(--text-main);
    }

    .lang-option.active {
      color: var(--primary);
      background: #ecfdf5;
    }

    /* Текстовые стили */
    h2 {
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    p.subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.45;
    }

    /* 5 Звезд */
    .stars-wrapper {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--star-inactive);
    }

    .star-btn svg {
      width: 44px;
      height: 44px;
      fill: currentColor;
      transition: color 0.2s ease, filter 0.2s ease;
    }

    .star-btn.active {
      color: var(--star-active);
      transform: scale(1.1);
    }

    .star-btn.active svg {
      filter: drop-shadow(0 4px 10px rgba(251, 191, 36, 0.35));
    }

    .star-btn:active {
      transform: scale(0.95);
    }

    .rating-hint {
      min-height: 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    /* Экран жалобы */
    #complaint-screen {
      display: none;
      text-align: left;
      animation: fadeIn 0.25s ease;
    }

    .selected-rating-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #b45309;
      background: #fef3c7;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-size: 15px;
      font-family: inherit;
      background: #f8fafc;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.06);
    }

    textarea {
      resize: none;
      height: 105px;
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0 22px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-container input {
      margin-top: 2px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-container span {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      font-weight: 500;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .bottom-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .back-btn:hover {
      color: var(--text-main);
    }

    .fallback-link {
      font-size: 14px;
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }

    .fallback-link:hover {
      text-decoration: underline;
    }

    /* Экран благодарности */
    #success-screen {
      display: none;
      padding: 12px 0;
      animation: fadeIn 0.25s ease;
    }

    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #d1fae5;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Шапка с названием и выбором языка -->
    <div class="card-header">
      <div id="venue-name" class="venue-badge">ReviewsTap</div>

      <div class="lang-dropdown" id="lang-dropdown">
        <button type="button" class="lang-btn" id="lang-btn">
          <span id="current-lang-label">RUS</span>
          <svg class="lang-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="lang-menu" id="lang-menu">
          <button type="button" class="lang-option active" data-lang="ru">RUS</button>
          <button type="button" class="lang-option" data-lang="kk">KAZ</button>
          <button type="button" class="lang-option" data-lang="en">ENG</button>
        </div>
      </div>
    </div>

    <!-- 1. Экран выбора звезд -->
    <div id="choice-screen">
      <h2 id="t-title">Вам всё понравилось?</h2>
      <p class="subtitle" id="t-subtitle">Пожалуйста, оцените наш сервис</p>

      <div class="stars-wrapper" id="stars-container">
        <button type="button" class="star-btn" data-value="1" aria-label="1 star">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <button type="button" class="star-btn" data-value="2" aria-label="2 stars">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <button type="button" class="star-btn" data-value="3" aria-label="3 stars">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <button type="button" class="star-btn" data-value="4" aria-label="4 stars">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <button type="button" class="star-btn" data-value="5" aria-label="5 stars">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
      </div>

      <div class="rating-hint" id="rating-hint">Нажмите на звезду</div>
    </div>

    <!-- 2. Экран фиксации проблемы (1-3 звезды) -->
    <div id="complaint-screen">
      <div class="selected-rating-pill">
        <span>★</span>
        <span id="selected-rating-text">Оценка: 3 из 5</span>
      </div>

      <h2 id="t-comp-title">Опишите проблему</h2>
      <p class="subtitle" id="t-comp-subtitle" style="margin-bottom: 20px;">Помогите нам стать лучше. Руководство лично разберёт ситуацию.</p>

      <form id="feedback-form">
        <div class="form-group">
          <label for="feedback-text" id="t-label-problem">Что пошло не так?</label>
          <textarea id="feedback-text" placeholder="Опишите детали ситуации..." required></textarea>
        </div>

        <div class="form-group">
          <label for="feedback-contact" id="t-label-contact">Ваш номер или Instagram</label>
          <input type="text" id="feedback-contact" placeholder="+7 707 ... или @username" required>
        </div>

        <label class="checkbox-container">
          <input type="checkbox" id="consent-check" required>
          <span id="t-consent">Даю согласие на обработку персональных данных</span>
        </label>

        <button type="submit" id="submit-btn" class="btn-submit" disabled>Отправить обращение</button>
      </form>

      <div class="bottom-links">
        <button type="button" class="back-btn" id="back-to-stars">← Назад</button>
        <a id="link-fallback" href="#" target="_blank" rel="noopener noreferrer" class="fallback-link">Всё равно перейти в 2ГИС</a>
      </div>
    </div>

    <!-- 3. Экран благодарности -->
    <div id="success-screen">
      <div class="success-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 id="t-success-title">Спасибо за отзыв!</h2>
      <p class="subtitle" id="t-success-subtitle" style="margin-bottom: 0;">Ваше сообщение передано руководству. Мы свяжемся с вами.</p>
    </div>
  </div>

  <script>
    // РЕЕСТР ЗАВЕДЕНИЙ
    const VENUES = {
      "legenda": {
        name: "Legenda",
        gisUrl: "https://2gis.kz/almaty/firm/70000001078537616/tab/reviews/addreview",
        chatId: "5904604582"
      },
      "voronka": {
        name: "Voronka",
        gisUrl: "https://2gis.kz/almaty/firm/70000001099447089/tab/reviews/addreview",
        chatId: "5904604582"
      },
      "teddys_coffee": {
        name: "Teddy s Coffee",
        gisUrl: "https://2gis.kz/almaty/firm/70000001118403341/tab/reviews/addreview",
        chatId: "1046554693"
      },
      "mondo_coffee": {
        name: "Mondo Coffee",
        gisUrl: "https://2gis.kz/almaty/firm/70000001061332132/tab/reviews/addreview",
        chatId: "1046554693"
      }
    };

    // СЛОВАРЬ ПЕРЕВОДОВ (RUS / KAZ / ENG)
    const I18N = {
      ru: {
        code: "RUS",
        title: "Вам всё понравилось?",
        subtitle: "Пожалуйста, оцените наш сервис",
        tapStar: "Нажмите на звезду",
        starHints: ["", "Очень плохо", "Плохо", "Нормально", "Хорошо!", "Отлично!"],
        ratingPill: (r) => `Оценка: ${r} из 5`,
        compTitle: "Опишите проблему",
        compSubtitle: "Помогите нам стать лучше. Руководство лично разберёт ситуацию.",
        labelProblem: "Что пошло не так?",
        placeholderProblem: "Опишите детали ситуации...",
        labelContact: "Ваш номер или Instagram",
        placeholderContact: "+7 707 ... или @username",
        consent: "Даю согласие на обработку персональных данных",
        submit: "Отправить обращение",
        sending: "Отправка...",
        back: "← Назад",
        fallback: "Всё равно перейти в 2ГИС",
        successTitle: "Спасибо за отзыв!",
        successSubtitle: "Ваше сообщение передано руководству. Мы свяжемся с вами.",
        errSend: "Ошибка отправки: ",
        errNet: "Ошибка сети: проверьте соединение или сервер бота"
      },
      kk: {
        code: "KAZ",
        title: "Сізге бәрі ұнады ма?",
        subtitle: "Біздің қызмет көрсету сапасын бағалаңыз",
        tapStar: "Жұлдызшаны басыңыз",
        starHints: ["", "Өте нашар", "Нашар", "Орташа", "Жақсы!", "Керемет!"],
        ratingPill: (r) => `Баға: 5-тен ${r}`,
        compTitle: "Мәселені сипаттаңыз",
        compSubtitle: "Жақсаруымызға көмектесіңіз. Басшылық жағдайды жеке өзі қарастырады.",
        labelProblem: "Не нәрсе көңіліңізден шықпады?",
        placeholderProblem: "Жағдайды толығырақ жазыңыз...",
        labelContact: "Сіздің нөміріңіз немесе Instagram",
        placeholderContact: "+7 707 ... немесе @username",
        consent: "Дербес деректерді өңдеуге келісім беремін",
        submit: "Өтінішті жіберу",
        sending: "Жіберілуде...",
        back: "← Артқа",
        fallback: "Бәрібір 2ГИС-ке өту",
        successTitle: "Пікіріңізге рахмет!",
        successSubtitle: "Хабарламаңыз басшылыққа жіберілді. Біз сізбен хабарласамыз.",
        errSend: "Жіберу қатесі: ",
        errNet: "Желі қатесі: интернетті немесе бот серверін тексеріңіз"
      },
      en: {
        code: "ENG",
        title: "Did you enjoy everything?",
        subtitle: "Please rate our service",
        tapStar: "Tap a star to rate",
        starHints: ["", "Very bad", "Bad", "Okay", "Good!", "Excellent!"],
        ratingPill: (r) => `Rating: ${r} out of 5`,
        compTitle: "Describe the issue",
        compSubtitle: "Help us improve. Management will personally review your feedback.",
        labelProblem: "What went wrong?",
        placeholderProblem: "Please describe the details...",
        labelContact: "Your phone or Instagram",
        placeholderContact: "+7 707 ... or @username",
        consent: "I agree to the processing of personal data",
        submit: "Send feedback",
        sending: "Sending...",
        back: "← Back",
        fallback: "Go to 2GIS anyway",
        successTitle: "Thank you for your feedback!",
        successSubtitle: "Your message has been sent to management. We will contact you soon.",
        errSend: "Submission error: ",
        errNet: "Network error: please check your connection"
      }
    };

    let currentLang = 'ru';
    let selectedRating = 0;

    // Определение заведения из URL (?v=legenda)
    const searchStr = window.location.search || window.location.hash.replace(/^#\??/, '?');
    const urlParams = new URLSearchParams(searchStr);
    const rawSlug = (urlParams.get('v') || 'legenda').trim().toLowerCase();
    const venueSlug = VENUES[rawSlug] ? rawSlug : 'legenda';
    const currentVenue = VENUES[venueSlug];

    document.getElementById('venue-name').textContent = currentVenue.name;
    document.getElementById('link-fallback').href = currentVenue.gisUrl;

    const choiceScreen = document.getElementById('choice-screen');
    const complaintScreen = document.getElementById('complaint-screen');
    const successScreen = document.getElementById('success-screen');
    const ratingHint = document.getElementById('rating-hint');
    const starBtns = document.querySelectorAll('.star-btn');

    // ЛОГИКА ВЫПАДАЮЩЕГО СПИСКА ЯЗЫКОВ
    const langDropdown = document.getElementById('lang-dropdown');
    const langBtn = document.getElementById('lang-btn');
    const langOptions = document.querySelectorAll('.lang-option');

    langBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      langDropdown.classList.toggle('open');
    });

    document.addEventListener('click', () => {
      langDropdown.classList.remove('open');
    });

    langOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        const lang = opt.dataset.lang;
        setLanguage(lang);
        langDropdown.classList.remove('open');
      });
    });

    function setLanguage(lang) {
      currentLang = lang;
      const t = I18N[lang];

      document.documentElement.lang = lang;
      document.getElementById('current-lang-label').textContent = t.code;

      langOptions.forEach(o => o.classList.toggle('active', o.dataset.lang === lang));

      document.getElementById('t-title').textContent = t.title;
      document.getElementById('t-subtitle').textContent = t.subtitle;
      ratingHint.textContent = selectedRating ? t.starHints[selectedRating] : t.tapStar;

      if (selectedRating > 0) {
        document.getElementById('selected-rating-text').textContent = t.ratingPill(selectedRating);
      }

      document.getElementById('t-comp-title').textContent = t.compTitle;
      document.getElementById('t-comp-subtitle').textContent = t.compSubtitle;
      document.getElementById('t-label-problem').textContent = t.labelProblem;
      document.getElementById('feedback-text').placeholder = t.placeholderProblem;
      document.getElementById('t-label-contact').textContent = t.labelContact;
      document.getElementById('feedback-contact').placeholder = t.placeholderContact;
      document.getElementById('t-consent').textContent = t.consent;
      document.getElementById('submit-btn').textContent = t.submit;
      document.getElementById('back-to-stars').textContent = t.back;
      document.getElementById('link-fallback').textContent = t.fallback;
      document.getElementById('t-success-title').textContent = t.successTitle;
      document.getElementById('t-success-subtitle').textContent = t.successSubtitle;
    }

    // ЛОГИКА 5 ЗВЕЗД
    function highlightStars(count) {
      starBtns.forEach(btn => {
        const val = parseInt(btn.dataset.value, 10);
        btn.classList.toggle('active', val <= count);
      });
      const t = I18N[currentLang];
      ratingHint.textContent = count > 0 ? t.starHints[count] : t.tapStar;
    }

    starBtns.forEach(btn => {
      const val = parseInt(btn.dataset.value, 10);

      btn.addEventListener('mouseenter', () => highlightStars(val));
      btn.addEventListener('mouseleave', () => highlightStars(selectedRating));

      btn.addEventListener('click', () => {
        selectedRating = val;
        highlightStars(val);

        if (val >= 4) {
          // 4 или 5 звезд -> Переход в 2ГИС
          setTimeout(() => {
            window.location.href = currentVenue.gisUrl;
          }, 220);
        } else {
          // 1, 2 или 3 звезды -> Открываем форму жалобы
          document.getElementById('selected-rating-text').textContent = I18N[currentLang].ratingPill(val);
          setTimeout(() => {
            choiceScreen.style.display = 'none';
            complaintScreen.style.display = 'block';
          }, 220);
        }
      });
    });

    // Кнопка "Назад" к звездам
    document.getElementById('back-to-stars').addEventListener('click', () => {
      complaintScreen.style.display = 'none';
      choiceScreen.style.display = 'block';
    });

    // Чекбокс согласия
    const consentCheck = document.getElementById('consent-check');
    const submitBtn = document.getElementById('submit-btn');
    consentCheck.addEventListener('change', () => {
      submitBtn.disabled = !consentCheck.checked;
    });

    // Отправка жалобы на сервер
    document.getElementById('feedback-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const t = I18N[currentLang];
      submitBtn.disabled = true;
      submitBtn.textContent = t.sending;

      const text = document.getElementById('feedback-text').value.trim();
      const contact = document.getElementById('feedback-contact').value.trim();

      try {
        const response = await fetch('https://bot-py-rvtap.onrender.com/api/send-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            place_id: venueSlug,
            place_name: currentVenue.name,
            chat_id: currentVenue.chatId,
            rating: selectedRating,
            comment: `[Оценка: ${selectedRating}/5] ${text}`,
            contact: contact
          })
        });

        const data = await response.json();
        if (response.ok && (data.ok || data.status === "ok")) {
          complaintScreen.style.display = 'none';
          successScreen.style.display = 'block';
        } else {
          alert(t.errSend + (data.error || data.description || 'Unknown error'));
          submitBtn.disabled = false;
          submitBtn.textContent = t.submit;
        }
      } catch (err) {
        alert(t.errNet);
        submitBtn.disabled = false;
        submitBtn.textContent = t.submit;
      }
    });
  </script>
</body>
</html>
