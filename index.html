<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка на ReviewsTap</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      color: #333333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555555;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #0088cc;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0088cc;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0077b3;
    }
    button:disabled {
      background-color: #a0c9e6;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .status-msg.success {
      color: #2e7d32;
      display: block;
    }
    .status-msg.error {
      color: #d32f2f;
      display: block;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Оставить заявку</h2>
    
    <form id="orderForm">
      <div class="form-group">
        <label for="name">Ваше имя</label>
        <input type="text" id="name" placeholder="Например: Алинур" required />
      </div>

      <div class="form-group">
        <label for="phone">Номер телефона</label>
        <input type="tel" id="phone" placeholder="+7 707 000 00 00" required />
      </div>

      <div class="form-group">
        <label for="comment">Комментарий к заявке</label>
        <textarea id="comment" placeholder="Например: табличка 2GIS"></textarea>
      </div>

      <button type="submit" id="submitBtn">Отправить</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    // Актуальные реквизиты Telegram бота
    const BOT_TOKEN = '8817952265:AAFCddec3U3yM9eoGr_M1B4_7SUHnQkmo5o';
    const CHAT_ID = '5904604582';

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      // Блокируем кнопку на время отправки
      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправка...';
      statusMsg.className = 'status-msg';
      statusMsg.textContent = '';

      // Получаем значения полей
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const comment = document.getElementById('comment').value.trim();

      // Формируем текст с безопасным HTML-форматированием
      const messageText = `
<b>🔔 Новая заявка с сайта!</b>

<b>Имя:</b> ${name}
<b>Телефон:</b> ${phone}
<b>Комментарий:</b> ${comment || 'Не указан'}
      `.trim();

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: messageText,
            parse_mode: 'HTML'
          })
        });

        const data = await response.json();

        if (data.ok) {
          statusMsg.className = 'status-msg success';
          statusMsg.textContent = 'Заявка успешно отправлена!';
          form.reset();
        } else {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = 'Ошибка Telegram: ' + (data.description || 'Не удалось отправить');
          console.error('Telegram API error:', data);
        }
      } catch (err) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Ошибка соединения. Проверьте интернет или консоль.';
        console.error('Fetch error:', err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Отправить';
      }
    });
  </script>
</body>
</html>
