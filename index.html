<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Оценка качества обслуживания</title>
  <style>
    :root {
      --primary: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      text-align: center;
      transition: all 0.3s ease;
    }

    .venue-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* Экран 1: Выбор Да / Нет */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .choice-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: #fff;
      cursor: pointer;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .choice-btn:active {
      transform: scale(0.97);
    }

    .choice-btn.yes:hover {
      border-color: var(--primary);
      background: #ecfdf5;
    }

    .choice-btn.no:hover {
      border-color: var(--danger);
      background: #fef2f2;
    }

    .choice-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .yes .choice-icon {
      background: #d1fae5;
      color: var(--primary);
    }

    .no .choice-icon {
      background: #fee2e2;
      color: var(--danger);
    }

    .choice-label {
      font-size: 17px;
      font-weight: 600;
    }

    /* Экран 2: Форма проблемы */
    #complaint-screen {
      display: none;
      text-align: left;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 15px;
      color: var(--text-main);
      background: #f8fafc;
      outline: none;
      transition: border 0.2s;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: #3b82f6;
      background: #fff;
    }

    textarea {
      resize: none;
      height: 100px;
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0 20px;
      cursor: pointer;
    }

    .checkbox-container input {
      margin-top: 3px;
      width: 17px;
      height: 17px;
      accent-color: #0f172a;
      cursor: pointer;
    }

    .checkbox-container span {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      user-select: none;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .fallback-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #0284c7;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
    }

    /* Экран благодарности */
    #success-screen {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="venue-name" class="venue-badge">ReviewsTap</div>

    <!-- 1. Экран оценки -->
    <div id="choice-screen">
      <h2>Вам всё понравилось?</h2>
      <p class="subtitle">Пожалуйста, оцените наш сервис</p>

      <div class="choices-grid">
        <!-- Кнопка ДА: уходит в 2GIS -->
        <a id="btn-yes" href="#" target="_blank" rel="noopener noreferrer" class="choice-btn yes">
          <div class="choice-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <span class="choice-label">Да</span>
        </a>

        <!-- Кнопка НЕТ: открывает форму -->
        <button type="button" id="btn-no" class="choice-btn no">
          <div class="choice-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </div>
          <span class="choice-label">Нет</span>
        </button>
      </div>
    </div>

    <!-- 2. Экран фиксации проблемы -->
    <div id="complaint-screen">
      <h2>Опишите проблему</h2>
      <p class="subtitle" style="margin-bottom: 20px;">Помогите нам стать лучше. Руководство лично разберёт ситуацию.</p>

      <form id="feedback-form">
        <div class="form-group">
          <label for="feedback-text">Что пошло не так?</label>
          <textarea id="feedback-text" placeholder="Опишите, пожалуйста, детали ситуации..." required></textarea>
        </div>

        <div class="form-group">
          <label for="feedback-contact">Ваш номер или Instagram</label>
          <input type="text" id="feedback-contact" placeholder="+7 707 ... или @username" required>
        </div>

        <label class="checkbox-container">
          <input type="checkbox" id="consent-check" required>
          <span>Даю согласие на обработку персональных данных</span>
        </label>

        <button type="submit" id="submit-btn" class="btn-submit" disabled>Отправить обращение</button>
      </form>

      <!-- Запасной переход в 2GIS -->
      <a id="link-fallback" href="#" target="_blank" rel="noopener noreferrer" class="fallback-link">Всё равно перейти в 2ГИС</a>
    </div>

    <!-- 3. Экран успешной отправки -->
    <div id="success-screen">
      <div class="choice-icon" style="background: #d1fae5; color: #10b981; margin: 0 auto 16px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2>Спасибо за отзыв!</h2>
      <p class="subtitle" style="margin-bottom: 0;">Ваше сообщение уже передано управляющему. Мы свяжемся с вами в ближайшее время.</p>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // РЕЕСТР ЗАВЕДЕНИЙ
    // Добавляйте сюда новые точки. Каждой можно задать своё название,
    // ссылку на 2GIS и отдельный chat_id, если они разные.
    // -------------------------------------------------------------
    const VENUES = {
      "default": {
        name: "ReviewsTap",
        gisUrl: "https://2gis.kz/almaty/firm/70000001078537616/tab/reviews/addreview",
        chatId: "5904604582"
      },
      "coffee_hub": {
        name: "Coffee Hub Almaty",
        gisUrl: "https://2gis.kz/almaty/firm/70000001078537616/tab/reviews",
        chatId: "5904604582"
      },
      "burger_bar": {
        name: "Burger Bar Dostyk",
        gisUrl: "https://2gis.kz/almaty/firm/70000001078537616/tab/reviews",
        chatId: "5904604582"
      }
    };

    const BOT_TOKEN = "8817952265:AAFCddec3U3yM9eoGr_M1B4_7SUHnQkmo5o";

    // Определение заведения из URL: ?v=slug (например, ?v=coffee_hub)
    const urlParams = new URLSearchParams(window.location.search);
    const venueSlug = urlParams.get('v') || 'default';
    const currentVenue = VENUES[venueSlug] || VENUES['default'];

    // Инициализация интерфейса под заведение
    document.getElementById('venue-name').textContent = currentVenue.name;
    document.getElementById('btn-yes').href = currentVenue.gisUrl;
    document.getElementById('link-fallback').href = currentVenue.gisUrl;

    // Переключение экранов
    const choiceScreen = document.getElementById('choice-screen');
    const complaintScreen = document.getElementById('complaint-screen');
    const successScreen = document.getElementById('success-screen');

    document.getElementById('btn-no').addEventListener('click', () => {
      choiceScreen.style.display = 'none';
      complaintScreen.style.display = 'block';
    });

    // Валидация чекбокса согласия
    const consentCheck = document.getElementById('consent-check');
    const submitBtn = document.getElementById('submit-btn');

    consentCheck.addEventListener('change', () => {
      submitBtn.disabled = !consentCheck.checked;
    });

    // Обработка отправки жалобы в Telegram
    document.getElementById('feedback-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "Отправка...";

      const text = document.getElementById('feedback-text').value.trim();
      const contact = document.getElementById('feedback-contact').value.trim();

      const message = `
⚠️ <b>Негативный отзыв / Жалоба!</b>
📍 <b>Заведение:</b> ${currentVenue.name} (<code>${venueSlug}</code>)

📝 <b>Проблема:</b>
${text}

👤 <b>Контакт клиента:</b> ${contact}
      `.trim();

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: currentVenue.chatId,
            text: message,
            parse_mode: 'HTML'
          })
        });

        const data = await response.json();

        if (data.ok) {
          complaintScreen.style.display = 'none';
          successScreen.style.display = 'block';
        } else {
          alert('Ошибка отправки: ' + data.description);
          submitBtn.disabled = false;
          submitBtn.textContent = "Отправить обращение";
        }
      } catch (err) {
        alert('Ошибка сети при отправке обращения');
        submitBtn.disabled = false;
        submitBtn.textContent = "Отправить обращение";
      }
    });
  </script>
</body>
</html>
