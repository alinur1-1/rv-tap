<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оцените наш сервис</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --accent-yes: #10b981;
      --accent-no: #ef4444;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 28px 20px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--subtext);
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-yes {
      background-color: var(--accent-yes);
      color: #fff;
    }

    .btn-no {
      background-color: #fee2e2;
      color: var(--accent-no);
    }

    #feedback-section {
      display: none;
      margin-top: 24px;
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--subtext);
      margin-bottom: 6px;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 14px;
      outline: none;
    }

    .consent-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
      text-align: left;
    }

    .consent-box input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--text);
      cursor: pointer;
    }

    .consent-box label {
      font-size: 12px;
      line-height: 1.4;
      color: var(--subtext);
      font-weight: 400;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: var(--text);
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      opacity: 0.7;
    }

    #success-message {
      display: none;
      margin-top: 20px;
      color: var(--accent-yes);
      font-weight: 600;
      font-size: 15px;
    }

    .soft-link {
      display: block;
      margin-top: 16px;
      font-size: 12px;
      color: var(--subtext);
      text-decoration: underline;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="main-content">
      <img src="https://via.placeholder.com/80" alt="Логотип" class="logo">
      <h1 id="place-title">Вам всё понравилось?</h1>
      <p class="subtitle">Ваш отзыв помогает нам становиться лучше каждый день</p>

      <div class="btn-group">
        <button class="btn btn-yes" onclick="handleYes()">👍 Да</button>
        <button class="btn btn-no" onclick="handleNo()">👎 Нет</button>
      </div>
    </div>

    <!-- Форма отрицательного отзыва -->
    <div id="feedback-section">
      <h2 style="font-size: 16px; margin-bottom: 12px;">Расскажите, что пошло не так?</h2>
      
      <label for="comment">Что именно вам не понравилось?</label>
      <textarea id="comment" rows="3" placeholder="Опишите ситуацию..."></textarea>

      <label for="contact">Ваш номер телефона / Instagram:</label>
      <input type="text" id="contact" placeholder="+7 (7xx) xxx-xx-xx">

      <div class="consent-box">
        <input type="checkbox" id="consent-check" onchange="toggleSubmitButton()">
        <label for="consent-check">
          Я согласен(на) на обработку персональных данных (номера телефона) для связи со мной администрацией заведения.
        </label>
      </div>

      <button id="submit-btn" class="btn-submit" onclick="sendComplaint()" disabled>Отправить руководству</button>
      
      <a id="direct-map-link" class="soft-link" href="#">Все равно перейти в 2GIS</a>
    </div>

    <div id="success-message">
      Спасибо! Сообщение отправлено руководству. Мы свяжемся с вами в течение 15 минут, чтобы исправить ситуацию.
    </div>
  </div>

  <script>
    // ================= СПИСОК ЗАВЕДЕНИЙ И ССЫЛОК =================
    const NEW_TWOGIS_URL = "https://2gis.kz/almaty/geo/70000001116117394?inv_by=ac28da18000a47658477956c82e8772f&inv_ts=1792294358";

    const PLACES = {
      "default": {
        name: "Reviews Tap Demo",
        twogis_url: NEW_TWOGIS_URL
      },
      "cafe1": {
        name: "Филиал на Аль-Фараби",
        twogis_url: NEW_TWOGIS_URL
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const currentPlaceId = urlParams.get('place') || 'default';
    const placeData = PLACES[currentPlaceId] || PLACES['default'];

    // Вставьте актуальный URL туннеля или вашего внешнего сервера
    const API_ENDPOINT = "https://8w8slp2v-8080.eun1.devtunnels.ms/";

    document.getElementById('place-title').innerText = `Вам всё понравилось в ${placeData.name}?`;
    document.getElementById('direct-map-link').href = placeData.twogis_url;

    function handleYes() {
      window.location.href = placeData.twogis_url;
    }

    function handleNo() {
      document.querySelector('.btn-group').style.display = 'none';
      document.getElementById('feedback-section').style.display = 'block';
    }

    function toggleSubmitButton() {
      const checkbox = document.getElementById('consent-check');
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = !checkbox.checked;
    }

    async function sendComplaint() {
      const comment = document.getElementById('comment').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const consent = document.getElementById('consent-check').checked;
      const submitBtn = document.getElementById('submit-btn');

      if (!consent) {
        alert("Для отправки необходимо подтвердить согласие на обработку данных.");
        return;
      }

      if (!comment) {
        alert("Пожалуйста, опишите проблему.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Отправка...";

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "X-Tunnel-Skip-Anti-Phishing-Page": "1"
          },
          body: JSON.stringify({
            place_id: currentPlaceId,
            place_name: placeData.name,
            comment: comment,
            contact: contact
          })
        });

        if (!response.ok) {
          throw new Error("Код ответа: " + response.status);
        }

        document.getElementById('feedback-section').style.display = 'none';
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('success-message').style.display = 'block';

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.innerText = "Отправить руководству";
        alert("Ошибка отправки: " + error.message + ". Проверьте, запущен ли бот и активен ли туннель.");
      }
    }
  </script>
</body>
</html>
